name: Daily Patreon Keep-Alive

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the new token back to the repo
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run Script
        env:
          PATREON_CLIENT_ID: ${{ secrets.PATREON_CLIENT_ID }}
          PATREON_CLIENT_SECRET: ${{ secrets.PATREON_CLIENT_SECRET }}
        run: python keep_alive.py

      - name: Commit and Push New Token
        run: |
          git config --global user.name "PatreonBot"
          git config --global user.email "bot@github.com"
          git add token.txt
          git commit -m "Rotate Patreon Refresh Token [skip ci]" || echo "No changes to commit"
          git push
