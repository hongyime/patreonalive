name: Daily Patreon Keep-Alive

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Activity Script
        env:
          PATREON_CLIENT_ID: ${{ secrets.PATREON_CLIENT_ID }}
          PATREON_CLIENT_SECRET: ${{ secrets.PATREON_CLIENT_SECRET }}
        run: python keep_alive.py

      - name: Commit and Push New Token
        run: |
          git config --global user.name "Patreon-Bot"
          git config --global user.email "bot@github.com"
          git add token.txt
          git commit -m "Rotate Refresh Token [skip ci]" || echo "No changes to commit"
          git push
