name: OAuth Callback Tests

on:
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - requirements.txt
      - .github/workflows/oauth-tests.yml
  push:
    branches: [main]
    paths:
      - '**.py'
      - requirements.txt
      - .github/workflows/oauth-tests.yml

permissions:
  contents: read

concurrency:
  group: oauth-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: OAuth tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -B -m unittest discover -s tests -v
